version: 2

project_name: rad

before:
  hooks:
    - go mod download

builds:
  - id: rad
    main: ./main.go
    binary: rad
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/m87/rad/cmd.Version={{.Version}}

archives:
  - id: default
    ids:
      - rad
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
